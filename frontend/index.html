<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PDF Q&A Assistant</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
    .container{max-width:1000px;margin:0 auto}
    .header{text-align:center;color:#fff;margin-bottom:30px}
    .header h1{font-size:2.5rem;margin-bottom:10px}
    .card{background:#fff;border-radius:16px;padding:30px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
    .upload-section{border:2px dashed #667eea;border-radius:12px;padding:30px;text-align:center;background:#f8f9ff;transition:all .3s}
    .upload-section.dragging{background:#e8ebff;border-color:#764ba2;transform:scale(1.02)}
    .file-input-wrapper{display:inline-block;margin:20px 0}
    .file-input-wrapper input{display:none}
    .file-input-label{display:inline-block;padding:12px 30px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:8px;cursor:pointer;font-weight:600}
    .file-name{margin-top:15px;padding:10px;background:#e8ebff;border-radius:8px;color:#667eea;display:none}
    .file-name.visible{display:block}
    .upload-btn{margin-top:15px;padding:12px 40px;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;display:none}
    .upload-btn.visible{display:inline-block}
    .upload-btn:disabled{background:#9ca3af;cursor:not-allowed}
    .status{margin-top:15px;padding:12px;border-radius:8px;display:none}
    .status.visible{display:block}
    .status.success{background:#d1fae5;color:#065f46;border-left:4px solid #10b981}
    .status.error{background:#fee2e2;color:#991b1b;border-left:4px solid #ef4444}
    .status.loading{background:#dbeafe;color:#1e40af;border-left:4px solid #3b82f6}
    .doc-info{background:#f8f9ff;border-radius:8px;padding:15px 20px;margin-bottom:20px;border-left:4px solid #667eea;display:flex;justify-content:space-between;align-items:center;display:none}
    .doc-info.visible{display:flex}
    .doc-actions{display:flex;gap:10px}
    .add-pdf-btn,.remove-pdf-btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer}
    .add-pdf-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
    .remove-pdf-btn{background:#ef4444;color:#fff}
    .chat-container{display:flex;flex-direction:column;height:500px}
    .messages{flex:1;overflow-y:auto;padding:20px;background:#f9fafb;border-radius:12px;margin-bottom:20px;display:flex;flex-direction:column;gap:15px}
    .message{max-width:75%;padding:12px 18px;border-radius:12px;position:relative}
    .message-user{align-self:flex-end;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-bottom-right-radius:4px}
    .message-bot{align-self:flex-start;background:#fff;color:#1f2937;box-shadow:0 2px 8px rgba(0,0,0,0.1);border-bottom-left-radius:4px}
    .message-edit-btn{position:absolute;top:-10px;right:-10px;background:#fff;border:2px solid #667eea;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;font-size:12px}
    .message-user:hover .message-edit-btn{opacity:1}
    .message-edit-input{width:100%;padding:10px;border:2px solid #667eea;border-radius:8px;margin-bottom:10px}
    .message-edit-actions{display:flex;gap:10px;justify-content:flex-end}
    .edit-save-btn{background:#10b981;color:#fff}
    .edit-cancel-btn{background:#9ca3af;color:#fff}
    .edit-save-btn,.edit-cancel-btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer}
    .input-container{display:flex;gap:10px}
    .question-input{flex:1;padding:14px 20px;border:2px solid #e5e7eb;border-radius:12px}
    .question-input:focus{outline:none;border-color:#667eea}
    .ask-btn{padding:14px 30px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer}
    .ask-btn:disabled{background:#9ca3af}
    .empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
    .loader{display:inline-block;width:16px;height:16px;border:3px solid #fff;border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:768px){.input-container{flex-direction:column}.ask-btn{width:100%}}
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h1>📄 AI PDF Q&A Assistant</h1><p>Upload your PDF and ask questions - powered by RAG technology</p></div>
  <div class="card">
    <div class="upload-section" id="uploadSection">
      <h2 style="margin-bottom:15px;color:#667eea;">Upload Your Document</h2>
      <p style="color:#6b7280;margin-bottom:20px;">Drag and drop or click to select a PDF file</p>
      <div class="file-input-wrapper"><input type="file" id="fileInput" accept=".pdf"><label for="fileInput" class="file-input-label">📁 Choose PDF File</label></div>
      <div class="file-name" id="fileName"></div>
      <button class="upload-btn" id="uploadBtn"><span id="uploadBtnText">🚀 Upload & Index</span></button>
      <div class="status" id="status"></div>
    </div>
    <div class="doc-info" id="docInfo">
      <div><div class="doc-info-title">✅ Document Ready</div><div class="doc-info-details" id="docInfoDetails"></div></div>
      <div class="doc-actions"><button class="add-pdf-btn" id="addPdfBtn">➕ Add PDF</button><button class="remove-pdf-btn" id="removePdfBtn">🗑 Remove</button></div>
    </div>
  </div>
  <div class="card">
    <h2 style="margin-bottom:20px;color:#667eea;">💬 Ask Questions</h2>
    <div class="chat-container">
      <div class="messages" id="messages"><div class="empty-state"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg><p>Upload a PDF document to start asking questions</p></div></div>
      <div class="input-container"><input type="text" class="question-input" id="questionInput" placeholder="Type your question here..." disabled><button class="ask-btn" id="askBtn" disabled><span id="askBtnText">Ask</span></button></div>
    </div>
  </div>
</div>
<script>
  const API = "http://localhost:8000";
  let currentDocId = null, currentFileName = "";
  const uploadSection = document.getElementById("uploadSection"), fileInput = document.getElementById("fileInput"), fileNameDiv = document.getElementById("fileName"), uploadBtn = document.getElementById("uploadBtn"), uploadBtnText = document.getElementById("uploadBtnText"), statusDiv = document.getElementById("status"), docInfoDiv = document.getElementById("docInfo"), docInfoDetails = document.getElementById("docInfoDetails"), messagesDiv = document.getElementById("messages"), questionInput = document.getElementById("questionInput"), askBtn = document.getElementById("askBtn"), askBtnText = document.getElementById("askBtnText"), addPdfBtn = document.getElementById("addPdfBtn"), removePdfBtn = document.getElementById("removePdfBtn");
  docInfoDiv.style.display = "none";
  uploadSection.addEventListener("dragover", e => { e.preventDefault(); uploadSection.classList.add("dragging"); });
  uploadSection.addEventListener("dragleave", () => uploadSection.classList.remove("dragging"));
  uploadSection.addEventListener("drop", e => { e.preventDefault(); uploadSection.classList.remove("dragging"); if(e.dataTransfer.files[0]?.type === "application/pdf") { fileInput.files = e.dataTransfer.files; showFileName(e.dataTransfer.files[0]); } });
  fileInput.addEventListener("change", e => { if(e.target.files[0]) showFileName(e.target.files[0]); });
  addPdfBtn.onclick = () => resetUploadUI();
  removePdfBtn.onclick = async () => { if(!currentDocId) return; if(confirm("Remove this PDF? All chat history will be cleared.")) { currentDocId = null; currentFileName = ""; docInfoDiv.style.display = "none"; resetUploadUI(); clearMessages(); questionInput.disabled = true; askBtn.disabled = true; showStatus("PDF removed successfully", "success"); setTimeout(() => hideStatus(), 3000); } };
  function resetUploadUI() { fileInput.value = ""; fileNameDiv.textContent = ""; fileNameDiv.classList.remove("visible"); uploadBtn.classList.remove("visible"); uploadBtn.disabled = false; uploadBtnText.textContent = "🚀 Upload & Index"; hideStatus(); }
  function showFileName(file) { currentFileName = file.name; fileNameDiv.textContent = `📄 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`; fileNameDiv.classList.add("visible"); uploadBtn.classList.add("visible"); hideStatus(); }
  function showStatus(msg, type) { statusDiv.textContent = msg; statusDiv.className = `status visible ${type}`; }
  function hideStatus() { statusDiv.classList.remove("visible"); }
  function clearMessages() { messagesDiv.innerHTML = `<div class="empty-state"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg><p>Start asking questions about your document</p></div>`; }
  function addMessage(text, isUser = false) { const empty = messagesDiv.querySelector(".empty-state"); if(empty) empty.remove(); const msgDiv = document.createElement("div"); msgDiv.className = isUser ? "message message-user" : "message message-bot"; msgDiv.textContent = text; if(isUser) { const editBtn = document.createElement("button"); editBtn.className = "message-edit-btn"; editBtn.innerHTML = "✏️"; editBtn.title = "Edit question"; editBtn.onclick = () => editMessage(msgDiv, text); msgDiv.appendChild(editBtn); } messagesDiv.appendChild(msgDiv); messagesDiv.scrollTop = messagesDiv.scrollHeight; }
  function editMessage(msgElement, originalText) { const container = document.createElement("div"); container.innerHTML = `<input class="message-edit-input" value="${originalText.replace(/"/g, '&quot;')}"><div class="message-edit-actions"><button class="edit-cancel-btn">Cancel</button><button class="edit-save-btn">Save & Ask</button></div>`; msgElement.parentNode.insertBefore(container, msgElement); msgElement.style.display = "none"; const input = container.querySelector(".message-edit-input"), cancelBtn = container.querySelector(".edit-cancel-btn"), saveBtn = container.querySelector(".edit-save-btn"); input.focus(); input.select(); cancelBtn.onclick = () => { container.remove(); msgElement.style.display = "block"; }; saveBtn.onclick = () => { const newQuestion = input.value.trim(); if(newQuestion && newQuestion !== originalText) { container.remove(); msgElement.remove(); askQuestion(newQuestion); } else cancelBtn.click(); }; input.addEventListener("keypress", e => { if(e.key === "Enter") saveBtn.click(); }); }
  function askQuestion(question) { addMessage(question, true); questionInput.value = ""; askBtn.disabled = true; askBtnText.innerHTML = '<span class="loader"></span>Thinking...'; sendQuestionToAPI(question); }
  async function sendQuestionToAPI(question) { try { const res = await fetch(`${API}/ask`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ doc_id: currentDocId, question }) }); if(!res.ok) throw new Error("Server error"); const data = await res.json(); addMessage(data.answer, false); } catch(err) { addMessage(`Error: ${err.message}`, false); } finally { askBtn.disabled = false; askBtnText.textContent = "Ask"; } }
  uploadBtn.onclick = async () => { const file = fileInput.files[0]; if(!file) { showStatus("Please choose a PDF first", "error"); return; } uploadBtn.disabled = true; uploadBtnText.innerHTML = '<span class="loader"></span>Uploading...'; showStatus("Processing your document...", "loading"); const formData = new FormData(); formData.append("file", file); try { const res = await fetch(`${API}/upload`, { method: "POST", body: formData }); if(!res.ok) throw new Error("Upload failed"); const data = await res.json(); currentDocId = data.doc_id; currentFileName = file.name; showStatus("Upload successful! Ready for questions.", "success"); docInfoDetails.innerHTML = `<strong>File:</strong> ${currentFileName}<br><strong>Document ID:</strong> ${currentDocId}<br><strong>Chunks indexed:</strong> ${data.num_chunks}`; docInfoDiv.style.display = "flex"; questionInput.disabled = false; askBtn.disabled = false; clearMessages(); setTimeout(() => { uploadBtn.disabled = false; uploadBtnText.textContent = "🚀 Upload & Index"; }, 2000); } catch(err) { showStatus(`Upload error: ${err.message}`, "error"); uploadBtn.disabled = false; uploadBtnText.textContent = "🚀 Upload & Index"; } };
  askBtn.onclick = async () => { const question = questionInput.value.trim(); if(!question) return; if(!currentDocId) { showStatus("Please upload a PDF first", "error"); return; } askQuestion(question); };
  questionInput.addEventListener("keypress", e => { if(e.key === "Enter" && !askBtn.disabled) askBtn.click(); });
</script>
</body>
</html>

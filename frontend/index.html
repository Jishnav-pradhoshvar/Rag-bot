<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PDF Q&A Assistant</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}.container{max-width:1000px;margin:0 auto}.header{text-align:center;color:#fff;margin-bottom:30px;animation:fadeIn .6s ease-in}.header h1{font-size:2.5rem;margin-bottom:10px;text-shadow:2px 2px 4px rgba(0,0,0,.2)}.header p{font-size:1.1rem;opacity:.9}.card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:30px;margin-bottom:20px;animation:slideUp .6s ease-out}.upload-section{border:2px dashed #667eea;border-radius:12px;padding:30px;text-align:center;transition:all .3s;background:#f8f9ff}.upload-section:hover{border-color:#764ba2;background:#f0f2ff}.upload-section.dragging{background:#e8ebff;border-color:#764ba2;transform:scale(1.02)}.file-input-wrapper{position:relative;display:inline-block;margin:20px 0}.file-input-wrapper input[type="file"]{display:none}.file-input-label{display:inline-block;padding:12px 30px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:8px;cursor:pointer;transition:all .3s;font-weight:600}.file-input-label:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(102,126,234,.4)}.file-name{margin-top:15px;padding:10px 20px;background:#e8ebff;border-radius:8px;color:#667eea;font-weight:500;display:none}.file-name.visible{display:block}.upload-btn{margin-top:15px;padding:12px 40px;background:#10b981;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s;display:none}.upload-btn.visible{display:inline-block}.upload-btn:hover:not(:disabled){background:#059669;transform:translateY(-2px);box-shadow:0 5px 20px rgba(16,185,129,.4)}.upload-btn:disabled{background:#9ca3af;cursor:not-allowed}.status{margin-top:15px;padding:12px 20px;border-radius:8px;font-weight:500;display:none;animation:fadeIn .3s}.status.visible{display:block}.status.success{background:#d1fae5;color:#065f46;border-left:4px solid #10b981}.status.error{background:#fee2e2;color:#991b1b;border-left:4px solid #ef4444}.status.loading{background:#dbeafe;color:#1e40af;border-left:4px solid #3b82f6}.doc-info{padding:15px 20px;background:#f8f9ff;border-radius:8px;margin-bottom:20px;border-left:4px solid #667eea;display:flex;justify-content:space-between;align-items:center;display:none}.doc-info.visible{display:flex}.doc-info-content{flex:1}.doc-info-title{font-weight:600;color:#667eea;margin-bottom:5px}.doc-info-details{color:#6b7280;font-size:.9rem}.doc-actions{display:flex;gap:10px;margin-left:15px}.add-pdf-btn,.remove-pdf-btn{padding:8px 16px;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:5px}.add-pdf-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}.add-pdf-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.3)}.remove-pdf-btn{background:#ef4444;color:#fff}.remove-pdf-btn:hover{background:#dc2626;transform:translateY(-2px);box-shadow:0 5px 15px rgba(239,68,68,.3)}.chat-container{display:flex;flex-direction:column;height:500px}.messages{flex:1;overflow-y:auto;padding:20px;background:#f9fafb;border-radius:12px;margin-bottom:20px;display:flex;flex-direction:column;gap:15px}.messages::-webkit-scrollbar{width:8px}.messages::-webkit-scrollbar-track{background:#e5e7eb;border-radius:4px}.messages::-webkit-scrollbar-thumb{background:#9ca3af;border-radius:4px}.messages::-webkit-scrollbar-thumb:hover{background:#6b7280}.message{max-width:75%;padding:12px 18px;border-radius:12px;animation:messageSlide .3s;line-height:1.5;position:relative}.message-user{align-self:flex-end;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-bottom-right-radius:4px}.message-bot{align-self:flex-start;background:#fff;color:#1f2937;box-shadow:0 2px 8px rgba(0,0,0,.1);border-bottom-left-radius:4px}.message-edit-btn{position:absolute;top:-10px;right:-10px;background:#fff;border:2px solid #667eea;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#667eea;font-size:12px;opacity:0;transition:all .3s;box-shadow:0 2px 5px rgba(0,0,0,.2)}.message-user:hover .message-edit-btn{opacity:1}.message-edit-btn:hover{background:#667eea;color:#fff}.message-edit-input{width:100%;padding:10px 15px;border:2px solid #667eea;border-radius:8px;font-size:1rem;font-family:inherit;margin-bottom:10px}.message-edit-actions{display:flex;gap:10px;justify-content:flex-end}.edit-save-btn,.edit-cancel-btn{padding:6px 12px;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .3s}.edit-save-btn{background:#10b981;color:#fff}.edit-save-btn:hover{background:#059669}.edit-cancel-btn{background:#9ca3af;color:#fff}.edit-cancel-btn:hover{background:#6b7280}.input-container{display:flex;gap:10px}.question-input{flex:1;padding:14px 20px;border:2px solid #e5e7eb;border-radius:12px;font-size:1rem;transition:all .3s}.question-input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}.ask-btn{padding:14px 30px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s}.ask-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 20px rgba(102,126,234,.4)}.ask-btn:disabled{background:#9ca3af;cursor:not-allowed}.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}.empty-state svg{width:80px;height:80px;margin-bottom:20px;opacity:.5}.loader{display:inline-block;width:16px;height:16px;border:3px solid #fff;border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite;margin-right:8px}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes messageSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}@keyframes spin{to{transform:rotate(360deg)}}@media (max-width:768px){.header h1{font-size:1.8rem}.card{padding:20px}.message{max-width:85%}.input-container{flex-direction:column}.ask-btn{width:100%}.doc-info{flex-direction:column;align-items:flex-start;gap:10px}.doc-actions{margin-left:0;width:100%;justify-content:center}}
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h1>📄 AI PDF Q&A Assistant</h1><p>Upload your PDF and ask questions - powered by RAG technology</p></div>
  <div class="card"><div class="upload-section" id="upSec"><h2 style="margin-bottom:15px;color:#667eea;">Upload Your Document</h2><p style="color:#6b7280;margin-bottom:20px;">Drag and drop or click to select a PDF file</p><div class="file-input-wrapper"><input type="file" id="fIn" accept=".pdf"><label for="fIn" class="file-input-label"><span>📁 Choose PDF File</span></label></div><div class="file-name" id="fName"></div><button class="upload-btn" id="upBtn"><span id="upBtnTxt">🚀 Upload & Index</span></button><div class="status" id="stat"></div></div><div class="doc-info" id="docInfo"><div class="doc-info-content"><div class="doc-info-title">✅ Document Ready</div><div class="doc-info-details" id="docDet"></div></div><div class="doc-actions"><button class="add-pdf-btn" id="addPdfBtn"><span>➕ Add PDF</span></button><button class="remove-pdf-btn" id="rmPdfBtn"><span>🗑 Remove</span></button></div></div></div>
  <div class="card"><h2 style="margin-bottom:20px;color:#667eea;">💬 Ask Questions</h2><div class="chat-container"><div class="messages" id="msgBox"><div class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg><p>Upload a PDF document to start asking questions</p></div></div><div class="input-container"><input type="text" class="question-input" id="qIn" placeholder="Type your question here..." disabled><button class="ask-btn" id="askBtn" disabled><span id="askBtnTxt">Ask</span></button></div></div></div>
</div>
<script>
  const API="http://localhost:8000";
  let docId=null, fileNameCurr="";
  const upSec=document.getElementById("upSec"),fIn=document.getElementById("fIn"),fName=document.getElementById("fName"),upBtn=document.getElementById("upBtn"),upBtnTxt=document.getElementById("upBtnTxt"),stat=document.getElementById("stat"),docInfoDiv=document.getElementById("docInfo"),docDet=document.getElementById("docDet"),msgBox=document.getElementById("msgBox"),qIn=document.getElementById("qIn"),askBtn=document.getElementById("askBtn"),askBtnTxt=document.getElementById("askBtnTxt"),addBtn=document.getElementById("addPdfBtn"),rmBtn=document.getElementById("rmPdfBtn");
  docInfoDiv.style.display="none";
  upSec.addEventListener("dragover",e=>{e.preventDefault();upSec.classList.add("dragging");});
  upSec.addEventListener("dragleave",()=>upSec.classList.remove("dragging"));
  upSec.addEventListener("drop",e=>{e.preventDefault();upSec.classList.remove("dragging");if(e.dataTransfer.files.length&&e.dataTransfer.files[0].type==="application/pdf"){fIn.files=e.dataTransfer.files;showFileName(e.dataTransfer.files[0]);}});
  fIn.addEventListener("change",e=>{if(e.target.files.length)showFileName(e.target.files[0]);});
  addBtn.onclick=()=>resetUI();
  rmBtn.onclick=async()=>{if(!docId)return;if(confirm("Remove this PDF? Chat history will be cleared.")){docId=null;fileNameCurr="";docInfoDiv.style.display="none";resetUI();clearMsgs();qIn.disabled=true;askBtn.disabled=true;showStat("PDF removed successfully","success");setTimeout(()=>hideStat(),3000);}};
  function resetUI(){fIn.value="";fName.textContent="";fName.classList.remove("visible");upBtn.classList.remove("visible");upBtn.disabled=false;upBtnTxt.textContent="🚀 Upload & Index";hideStat();}
  function showFileName(f){fileNameCurr=f.name;fName.textContent=`📄 ${f.name} (${(f.size/1024/1024).toFixed(2)} MB)`;fName.classList.add("visible");upBtn.classList.add("visible");hideStat();}
  function showStat(msg,type){stat.textContent=msg;stat.className=`status visible ${type}`;}
  function hideStat(){stat.classList.remove("visible");}
  function clearMsgs(){msgBox.innerHTML=`<div class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg><p>Start asking questions about your document</p></div>`;}
  function addMsg(txt,isUser=false){const empty=msgBox.querySelector(".empty-state");if(empty)empty.remove();const d=document.createElement("div");d.className=isUser?"message message-user":"message message-bot";d.textContent=txt;if(isUser){const eb=document.createElement("button");eb.className="message-edit-btn";eb.innerHTML="✏️";eb.title="Edit question";eb.onclick=()=>editMsg(d,txt);d.appendChild(eb);}msgBox.appendChild(d);msgBox.scrollTop=msgBox.scrollHeight;}
  function editMsg(el,orig){const cont=document.createElement("div");cont.innerHTML=`<input type="text" class="message-edit-input" value="${orig.replace(/"/g,'&quot;')}"><div class="message-edit-actions"><button class="edit-cancel-btn">Cancel</button><button class="edit-save-btn">Save & Ask</button></div>`;el.parentNode.insertBefore(cont,el);el.style.display="none";const inp=cont.querySelector(".message-edit-input"),cancel=cont.querySelector(".edit-cancel-btn"),save=cont.querySelector(".edit-save-btn");inp.focus();inp.select();cancel.onclick=()=>{cont.remove();el.style.display="block";};save.onclick=()=>{const newQ=inp.value.trim();if(newQ&&newQ!==orig){cont.remove();el.remove();askQuestion(newQ);}else cancel.click();};inp.addEventListener("keypress",e=>{if(e.key==="Enter")save.click();});}
  function askQuestion(q){addMsg(q,true);qIn.value="";askBtn.disabled=true;askBtnTxt.innerHTML='<span class="loader"></span>Thinking...';sendQ(q);}
  async function sendQ(q){try{const r=await fetch(`${API}/ask`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({doc_id:docId,question:q})});if(!r.ok)throw new Error("Server error");const d=await r.json();addMsg(d.answer,false);}catch(e){addMsg(`Error: ${e.message}`,false);}finally{askBtn.disabled=false;askBtnTxt.textContent="Ask";}}
  upBtn.onclick=async()=>{const f=fIn.files[0];if(!f){showStat("Please choose a PDF first","error");return;}upBtn.disabled=true;upBtnTxt.innerHTML='<span class="loader"></span>Uploading...';showStat("Processing your document...","loading");const fd=new FormData();fd.append("file",f);try{const res=await fetch(`${API}/upload`,{method:"POST",body:fd});if(!res.ok)throw new Error("Upload failed");const data=await res.json();docId=data.doc_id;fileNameCurr=f.name;showStat("Upload successful! Ready for questions.","success");docDet.innerHTML=`<strong>File:</strong> ${fileNameCurr}<br><strong>Document ID:</strong> ${docId}<br><strong>Chunks indexed:</strong> ${data.num_chunks}`;docInfoDiv.style.display="flex";qIn.disabled=false;askBtn.disabled=false;clearMsgs();setTimeout(()=>{upBtn.disabled=false;upBtnTxt.textContent="🚀 Upload & Index";},2000);}catch(err){showStat(`Upload error: ${err.message}`,"error");upBtn.disabled=false;upBtnTxt.textContent="🚀 Upload & Index";}};
  askBtn.onclick=async()=>{const q=qIn.value.trim();if(!q)return;if(!docId){showStat("Please upload a PDF first","error");return;}askQuestion(q);};
  qIn.addEventListener("keypress",e=>{if(e.key==="Enter"&&!askBtn.disabled)askBtn.click();});
</script>
</body>
</html>
